services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      # Lean is not installed in this image, so verification reports "not checked".
      # Set AUTOPROOF_TRUSTED_LEAN=1 only on a machine where running Lean on submitted text is acceptable.
      - DATABASE_PATH=/app/data/autoproof.db
      - AUTOPROOF_TRUSTED_LEAN=0
      - AUTOPROOF_CORS_ORIGINS=http://localhost:3000
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
